<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCK Pte Ltd — Chat with Chu Kang</title>
<style>
  :root {
    --yellow: #ffd400;
    --orange: #ff7f00;
    --dark: #1a1a1a;
    --cream: #fff8e1;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--cream);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--dark);
    color: var(--yellow);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo {
    width: 44px; height: 44px;
    background: var(--yellow);
    color: var(--dark);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 14px;
    border: 3px solid var(--orange);
    flex-shrink: 0;
  }
  header h1 { font-size: 18px; }
  header .tagline { color: #bbb; font-size: 12px; font-style: italic; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--orange);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.pck {
    align-self: flex-start;
    background: var(--dark);
    color: var(--yellow);
    border-bottom-left-radius: 4px;
  }
  .msg.pck .who, .msg.user .who {
    display: block;
    font-size: 10px;
    opacity: 0.6;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .msg.typing { font-style: italic; opacity: 0.8; }
  #composer {
    display: flex;
    gap: 10px;
    padding: 14px 20px;
    background: #fff;
    border-top: 3px solid var(--yellow);
  }
  #input {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid #ddd;
    border-radius: 24px;
    font-size: 15px;
    outline: none;
  }
  #input:focus { border-color: var(--orange); }
  #send {
    background: var(--orange);
    color: #fff;
    border: none;
    border-radius: 24px;
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  #send:disabled { opacity: 0.5; cursor: default; }
  .err {
    align-self: center;
    background: #c00; color: #fff;
    padding: 8px 14px; border-radius: 8px; font-size: 13px;
  }
</style>
</head>
<body>
<header>
  <div class="logo">PCK</div>
  <div>
    <h1>Phua Chu Kang</h1>
    <div class="tagline">PCK Pte Ltd — Best in Singapore, JB, and some say Batam.</div>
  </div>
</header>

<div id="chat">
  <div class="msg pck"><span class="who">Chu Kang</span>Oei! Chu Kang here. What you want? Renovation ah, or just come kaypoh? Ask lah, ask lah — I busy but never mind, can chat.</div>
</div>

<form id="composer">
  <input id="input" autocomplete="off" placeholder="Ask Chu Kang something lah..." autofocus>
  <button id="send" type="submit">Send</button>
</form>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const history = [];

function addMsg(cls, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  const who = cls === 'pck' ? 'Chu Kang' : 'You';
  div.innerHTML = `<span class="who">${who}</span>`;
  const span = document.createElement('span');
  span.textContent = text;
  div.appendChild(span);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return span;
}

document.getElementById('composer').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMsg('user', text);
  history.push({ role: 'user', content: text });

  const reply = addMsg('pck typing', '...');
  sendBtn.disabled = true;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `HTTP ${res.status}`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '', full = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const events = buf.split('\n\n');
      buf = events.pop();
      for (const ev of events) {
        const line = ev.split('\n').find(l => l.startsWith('data:'));
        if (!line) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') continue;
        try {
          const obj = JSON.parse(data);
          if (obj.type === 'content_block_delta' && obj.delta?.text) {
            full += obj.delta.text;
            reply.textContent = full;
            reply.parentElement.classList.remove('typing');
            chat.scrollTop = chat.scrollHeight;
          }
        } catch {}
      }
    }
    history.push({ role: 'assistant', content: full || '(Chu Kang blur liao, say again?)' });
  } catch (err) {
    reply.parentElement.classList.remove('pck', 'typing');
    reply.parentElement.className = 'err';
    reply.parentElement.textContent = 'Aiyah, got problem: ' + err.message;
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
